apiVersion: apps/v1
kind: Deployment
metadata:
 name: autoship-deployment
spec:
 replicas: 1
 selector: 
  matchLabels:
   app: autoship
 template:
  metadata:
   labels:
    app: autoship
  spec: 
   containers: 
    - name: autoship
      image: autoship:v1
      imagePullPolicy: IfNotPresent
      ports:
       - containerPort: 5000
      env:
       - name: APP_VERSION
         value: "kind-v1"
      readinessProbe:
       httpGet:
         path: /health
         port: 5000
       initialDelaySeconds: 3
       periodSeconds: 5
      livenessProbe: 
       httpGet:
         path: /health
         port: 5000
       initialDelaySeconds: 5
       periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: autoship-service
spec:
  type: ClusterIP
  selector: 
    app: autoship
  ports:
    - port: 5000
      targetPort: 5000
